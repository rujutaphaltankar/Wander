name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # No database service needed — Wander uses SQLite, a plain file on the
    # runner's disk that Prisma creates on demand.
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:./ci.db

      - name: Seed database
        run: npm run prisma:seed
        env:
          DATABASE_URL: file:./ci.db

      - name: Lint
        run: npm run lint --if-present

      - name: Type check & build
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: file:./ci.db
          JWT_SECRET: ci_test_secret
          REFRESH_TOKEN_SECRET: ci_test_refresh_secret
          NODE_ENV: test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build
